<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Grid: 9x9</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="header">
        <h1>Tech Grid 9x9</h1>
        <div class="status" id="status">System Ready: Player X Initiates</div>
    </div>

    <div class="board" id="board">
        <!-- Cells generated by JavaScript -->
    </div>

    <button onclick="initGame()">Reboot System</button>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const GRID_SIZE = 9;
        
        // LOGIC UPDATE: Changed from 5 to 9. 
        // This requires the entire row, column, or main diagonal to be filled.
        const WIN_TARGET = 9; 

        let boardData = [];
        let currentPlayer = 'X';
        let gameActive = true;

        function initGame() {
            boardElement.innerHTML = '';
            boardData = Array(GRID_SIZE * GRID_SIZE).fill('');
            currentPlayer = 'X';
            gameActive = true;
            statusElement.innerText = "System Ready: Player X's Turn";
            statusElement.style.color = "#ffffff";

            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                boardElement.appendChild(cell);
            }
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = parseInt(cell.dataset.index);

            if (boardData[index] !== '' || !gameActive) return;

            boardData[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());

            const winningCells = checkWin(index, currentPlayer);
            
            if (winningCells) {
                endGame(winningCells);
            } else if (!boardData.includes('')) {
                gameActive = false;
                statusElement.innerText = "Grid Locked: Draw Detected.";
            } else {
                // The prompt mentioned '0' or 'dots', so we switch between X and O
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                statusElement.innerText = `Player ${currentPlayer}'s Turn`;
            }
        }

        function checkWin(index, player) {
            const row = Math.floor(index / GRID_SIZE);
            const col = index % GRID_SIZE;
            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let [dr, dc] of directions) {
                let count = 1;
                let winLine = [index];

                for (let i = 1; i < WIN_TARGET; i++) {
                    const r = row + dr * i;
                    const c = col + dc * i;
                    if (isValid(r, c) && boardData[r * GRID_SIZE + c] === player) {
                        count++;
                        winLine.push(r * GRID_SIZE + c);
                    } else break;
                }

                for (let i = 1; i < WIN_TARGET; i++) {
                    const r = row - dr * i;
                    const c = col - dc * i;
                    if (isValid(r, c) && boardData[r * GRID_SIZE + c] === player) {
                        count++;
                        winLine.push(r * GRID_SIZE + c);
                    } else break;
                }

                if (count >= WIN_TARGET) return winLine;
            }
            return null;
        }

        function isValid(row, col) {
            return row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE;
        }

        function endGame(winningCells) {
            gameActive = false;
            statusElement.innerText = `Full Line Complete: Player ${currentPlayer} Wins!`;
            statusElement.style.color = "#00f3ff";
            
            const cells = document.querySelectorAll('.cell');
            winningCells.forEach(index => cells[index].classList.add('win'));
        }

        initGame();
    </script>
</body>
</html>
